# /etc/nginx/sites-available/churu-poll  ->  symlink into sites-enabled.
# Handles ONLY poll.vultusgo.in; the counting site's server block is untouched.
# Afterwards `certbot --nginx -d poll.vultusgo.in` adds the 443 block, certificate and http->https redirect.
# Security headers (CSP, HSTS, X-Frame-Options, nosniff, ...) come from the app (helmet), like the
# counting site, so they are identical over every path and cannot drift between nginx and the app.
server {
    listen 80;
    listen [::]:80;
    server_name poll.vultusgo.in;

    # Bulk officer Excel: up to 2 MB file, sent as base64 JSON (~2.7 MB).
    client_max_body_size 4m;

    # Slow 3G phones: compress the app bundle and the JSON API answers.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append): the app trusts exactly one hop (TRUST_PROXY=1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
