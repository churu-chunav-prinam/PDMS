# MySQL only (dev). The app runs on the host. Secrets come from backend/.env (gitignored).
# Own container, port and volume: never shares anything with the Churu-Results database.
services:
  mysql:
    image: mysql:8.4.11
    container_name: churu-poll-mysql
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+05:30
      - --log-bin-trust-function-creators=1
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - churu_poll_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  churu_poll_mysql_data:
